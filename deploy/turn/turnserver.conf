# ── coturn для SonetCord ──────────────────────────────────────────────
# Подробности и команды запуска — в README.md рядом с этим файлом.

# Слушаем стандартный STUN/TURN порт.
listening-port=3478

# Диапазон портов для relay-трафика (медиа идёт через них).
# Эти же UDP-порты нужно открыть в файрволе/security-group.
min-port=49152
max-port=65535

# Долговременные креды (логин/пароль). Должны совпадать с .env бэкенда:
#   TURN_USERNAME=zovcord
#   TURN_CREDENTIAL=<тот же пароль, что в строке user= ниже>
lt-cred-mech
user=zovcord:ЗАМЕНИ_НА_ДЛИННЫЙ_ПАРОЛЬ

# realm — любой домен, обычно домен твоего TURN-сервера.
realm=turn.example.com

# Внешний (публичный) IP сервера. На облачных VPS за NAT укажи так:
#   external-ip=ПУБЛИЧНЫЙ_IP/ВНУТРЕННИЙ_IP
# Если сервер с «белым» IP напрямую — просто:
#   external-ip=ПУБЛИЧНЫЙ_IP
external-ip=ЗАМЕНИ_НА_ПУБЛИЧНЫЙ_IP

fingerprint
no-multicast-peers
# Запрещаем relay на приватные/loopback диапазоны (защита от SSRF через TURN).
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# TLS не используем (бэкенд раздаёт только turn: на :3478, без turns:).
# Если захочешь turns: на 5349 — добавь cert=/pkey= и убери строки ниже.
no-tls
no-dtls

# Логи в stdout (видно через docker logs).
log-file=stdout
simple-log
