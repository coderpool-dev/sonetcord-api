name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: goydacord_test
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/Ej30NCiN7A6V0WSg8IzPpG8s4=
      BROADCAST_CONNECTION: 'null'
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'goydacord_test' || ':memory:' }}
      DB_USERNAME: root
      DB_PASSWORD: test
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      ENCRYPTION_KEY_1: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ENCRYPTION_ACTUAL: 1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, gd, curl, openssl, sodium
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php vendor/bin/phpunit --do-not-cache-result
      - if: matrix.database == 'sqlite'
        run: composer analyse
      - if: matrix.database == 'sqlite'
        run: composer lint
